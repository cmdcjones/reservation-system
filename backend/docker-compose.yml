services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: reservation-system
    ports:
      - "5432:5432"
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: test
      POSTGRES_PORT: 5433
    ports:
      - "5433:5432"
